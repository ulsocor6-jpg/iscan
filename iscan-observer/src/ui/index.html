<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
ISCAN Observer Mission Control
</title>

<style>

body{

    margin:0;

    background:#0f172a;

    color:white;

    font-family:Arial;

}

header{

    background:#111827;

    padding:18px;

    font-size:24px;

    font-weight:bold;

}

.grid{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:20px;

    padding:20px;

}

.card{

    background:#1e293b;

    border-radius:12px;

    padding:20px;

    box-shadow:0 0 12px rgba(0,0,0,.3);

}

.status{

    font-size:34px;

    margin-top:10px;

    font-weight:bold;

}

.green{

    color:#22c55e;

}

.red{

    color:#ef4444;

}

.orange{

    color:#f59e0b;

}

button{

    margin-top:15px;

    padding:10px 18px;

    font-size:15px;

    cursor:pointer;

}

#log{

    height:260px;

    overflow:auto;

    background:black;

    color:#00ff66;

    padding:10px;

    font-family:monospace;

    white-space:pre-wrap;

}

</style>

</head>

<body>

<header>

ISCAN External Observer Mission Control

</header>

<div class="grid">

<div class="card">

<h2>ISCAN Core</h2>

<div
id="coreStatus"
class="status orange">

UNKNOWN

</div>

<button id="restartBtn">

Restart ISCAN

</button>

</div>

<div class="card">

<h2>Observer</h2>

<div
id="observerStatus"
class="status green">

ONLINE

</div>

</div>

<div class="card">

<h2>Recovery</h2>

<div
id="recoveryStatus">

Idle

</div>

</div>

<div class="card" style="grid-column:1 / span 3">

<h2>Recovery Console</h2>

<div id="log"></div>

</div>

</div>

<script src="app.js"></script>

</body>

</html>
